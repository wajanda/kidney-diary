name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build the app
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log

      # If the build fails, post the error lines on the commit so they can be read without the full log.
      - name: Report build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -E "^e: |error:|What went wrong|Could not|FAILURE|> " build.log | head -80; echo '```'; } > errors.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@errors.md

      - name: Name the file
        run: cp app/build/outputs/apk/release/app-release.apk "KidneyDiary-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: KidneyDiary-apk
          path: KidneyDiary-*.apk

      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" "KidneyDiary-1.0.${{ github.run_number }}.apk" \
            --title "Kidney Diary 1.0.${{ github.run_number }}" \
            --notes "Open this page on your phone, tap the .apk file to download it, then tap it again to install."
